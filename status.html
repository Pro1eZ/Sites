<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'; connect-src https://api.trailrig.app; base-uri 'none'; form-action 'none'">
    <title>TrailRig Status</title>
    <meta name="description" content="Live status for TrailRig's backend and partner price-feed sync — check here if part search or Price Stalker results look stale in the free iOS bike app.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#bf5af2">
    <link rel="canonical" href="https://trailrig.app/status.html">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="trailrig-logo.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TrailRig">
    <meta property="og:url" content="https://trailrig.app/status.html">
    <meta property="og:title" content="TrailRig Status">
    <meta property="og:description" content="TrailRig backend and feed sync status.">
    <meta property="og:image" content="https://trailrig.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TrailRig — the bike component tracker for iPhone and iPad.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TrailRig Status">
    <meta name="twitter:description" content="TrailRig backend and feed sync status.">
    <meta name="twitter:image" content="https://trailrig.app/og-image.png">
    <style>
        :root {
            --bg: #000;
            --bg2: #1c1c1e;
            --bg3: #2c2c2e;
            --border: #3a3a3c;
            --text: #f2f2f7;
            --secondary: #aeaeb2;
            --purple: #bf5af2;
            --green: #30d158;
            --yellow: #ffd60a;
            --red: #ff453a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px); z-index: 10;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; text-decoration: none; color: inherit; }
        .nav-logo img { width: 28px; height: 28px; border-radius: 7px; }
        .nav-back { color: var(--purple); text-decoration: none; font-size: 0.9rem; }

        .container { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
        .subtitle { color: var(--secondary); font-size: 0.95rem; margin-bottom: 40px; }

        .overall {
            display: flex; align-items: center; gap: 14px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px 24px; margin-bottom: 32px;
        }
        .overall-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .overall-label { font-size: 1.1rem; font-weight: 700; }
        .overall-sub { color: var(--secondary); font-size: 0.85rem; margin-top: 2px; }

        .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--purple); margin-bottom: 12px; margin-top: 32px; }
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
        .card-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); gap: 12px; }
        .card-row:last-child { border-bottom: none; }
        .card-label { font-size: 0.95rem; font-weight: 600; }
        .card-sub { color: var(--secondary); font-size: 0.8rem; margin-top: 3px; }
        .card-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .card-value { font-size: 0.85rem; color: var(--secondary); }

        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge-green { background: rgba(48,209,88,0.15); color: var(--green); }
        .badge-yellow { background: rgba(255,214,10,0.15); color: var(--yellow); }
        .badge-red { background: rgba(255,69,58,0.15); color: var(--red); }
        .badge-gray { background: var(--bg3); color: var(--secondary); }

        .updated { color: var(--secondary); font-size: 0.78rem; text-align: center; margin-top: 32px; }
        .updated a { color: var(--purple); text-decoration: none; }
        .loading { color: var(--secondary); font-size: 0.95rem; text-align: center; padding: 60px 0; }
        .error-box { background: rgba(255,69,58,0.1); border: 1px solid rgba(255,69,58,0.3); border-radius: 12px; padding: 16px 20px; color: var(--red); font-size: 0.9rem; }
        .alert-banner { display: flex; align-items: flex-start; gap: 14px; background: rgba(255,69,58,0.1); border: 1px solid rgba(255,69,58,0.4); border-radius: 16px; padding: 18px 22px; margin-bottom: 20px; }
        .alert-banner-icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1; }
        .alert-banner-title { font-size: 1rem; font-weight: 700; color: var(--red); margin-bottom: 4px; }
        .alert-banner-body { font-size: 0.88rem; color: var(--secondary); line-height: 1.5; }
    </style>
</head>
<body>
<nav>
    <a href="index.html" class="nav-logo">
        <img src="trailrig-wordmark.png" alt="">
        <span style="color:#ffffff;">TrailRig</span>

    </a>
    <a href="index.html" class="nav-back">← Back</a>
</nav>

<div class="container">
    <h1>System Status</h1>
    <p class="subtitle">Live backend and feed sync health for TrailRig.</p>
    <div id="root"><p class="loading">Checking status…</p></div>
    <p class="updated" id="updated-at"></p>
</div>

<script src="status.js"></script>
</body>
</html>
