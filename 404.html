<!DOCTYPE html>

        body { margin: 0; background: #1a1a1c; color: #fff; font-family: -apple-system, sans-serif;

        p { color: #888; font-size: 15px; text-align: center; }

    <script>
        (function () {
            var path = window.location.pathname;

                window.location.replace('https://api.trailrig.app' + path + window.location.search);
            }
        })();
    </script>
